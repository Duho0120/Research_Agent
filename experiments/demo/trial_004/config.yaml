model:
  type: skeleton_transformer
  params:
    learning_rate: 0.1025
    d_model: 144
    nhead: 4
    num_layers: 3
    dropout: 0.25
features:
  use_frequency_encoding: false
  use_target_encoding: true
  use_interactions: true
  use_missing_indicators: true
  use_view_aware_features: true
  use_bed_wandering_aux_head: true
cv:
  n_splits: 5
  seed: 42
training:
  epochs: 100
  batch_size: 32
  warmup_epochs: 10
  early_stopping_patience: 25
